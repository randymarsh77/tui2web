[package]
name = "tui2web"
version = "0.1.0"
edition = "2021"
description = "Run ratatui TUI applications in the browser via WebAssembly"
license = "MIT"
repository = "https://github.com/randymarsh77/tui2web"
homepage = "https://github.com/randymarsh77/tui2web"
documentation = "https://docs.rs/tui2web"
readme = "../../README.md"
keywords = ["ratatui", "wasm", "terminal", "browser"]
categories = ["wasm", "command-line-interface"]

[lib]
crate-type = ["rlib"]

[dependencies]
ratatui = { version = "0.29", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "=0.2.0"
wasm-bindgen = { version = "0.2", optional = true }

[features]
default = []
wasm = ["dep:wasm-bindgen"]
git = []

[dev-dependencies]
vt100 = "0.15"

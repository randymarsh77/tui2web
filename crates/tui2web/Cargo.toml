[package]
name = "tui2web"
version = "0.1.0"
edition = "2021"
description = "Run ratatui TUI applications in the browser via WebAssembly"
license = "MIT"

[lib]
crate-type = ["rlib"]

[dependencies]
ratatui = { version = "0.26", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "=0.1.14"
wasm-bindgen = { version = "0.2", optional = true }

[features]
default = []
wasm = ["dep:wasm-bindgen"]
git = []

[dev-dependencies]
vt100 = "0.15"

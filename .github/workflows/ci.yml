name: CI
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo install wasm-pack --version 0.15.0 --locked
      - run: ./build.sh
      - run: npm run typecheck && npm test && npm run test:terminal
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Verify publishable artifacts without publishing
        run: node scripts/release.mjs package
      - uses: actions/upload-artifact@v4
        with:
          name: static-playground
          path: web
